[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-drift-detection"
version = "0.5.0"
description = "Concept-Drift-Aware Fraud Detection Platform under Streaming Financial Distributions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sheikh Joynal Abedin Sumon", email = "me@sumon.me" }
]
keywords = ["fraud-detection", "concept-drift", "stream-mining", "xgboost", "adwin", "ddm", "multi-armed-bandits", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "river==0.26.1",
    "shap==0.53.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "SQLAlchemy==2.1.4",
    "PyMySQL==1.2.3",
    "cryptography==50.0.1",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "fastapi==0.143.2",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[project.scripts]
fraud-pipeline = "src.pipeline:main"
fraud-audit = "src.evaluate_uid_split:run"
fraud-latency-audit = "src.delayed_audit:cli"
fraud-stats-rigor = "src.benchmark_statistical_rigor:run"
fraud-bandit = "src.bandit.benchmark:main"
fraud-study = "src.study:main"
fraud-demo = "src.demo:main"
fraud-latency = "src.benchmark_latency:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

