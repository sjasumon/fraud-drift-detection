[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-drift-detection"
version = "0.3.0"
description = "Concept-Drift-Aware Fraud Detection Platform under Streaming Financial Distributions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sheikh Joynal Abedin Sumon", email = "me@sumon.me" }
]
keywords = ["fraud-detection", "concept-drift", "stream-mining", "xgboost", "adwin", "ddm", "multi-armed-bandits", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "xgboost==3.4.1",
    "river==0.26.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "sqlalchemy==2.1.1",
    "pymysql==1.2.3",
    "cryptography==50.0.1",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "shap==0.52.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "psutil==7.1.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[project.scripts]
fraud-pipeline = "src.pipeline:main"
fraud-audit = "src.evaluate_uid_split:run"
fraud-latency-audit = "src.delayed_audit:main"
fraud-stats-rigor = "src.benchmark_statistical_rigor:run"
fraud-bandit = "src.bandit.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
