[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-drift-detection"
version = "0.3.0"
description = "Concept-Drift-Aware Fraud Detection Platform under Streaming Financial Distributions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sheikh Joynal Abedin Sumon", email = "s.sumon@auckland.ac.nz" }
]
keywords = ["fraud-detection", "concept-drift", "stream-mining", "xgboost", "adwin", "ddm", "multi-armed-bandits", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "river>=0.21.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "shap>=0.45.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fraud-pipeline = "src.pipeline:main"
fraud-audit = "src.evaluate_uid_split:run"
fraud-latency-audit = "src.delayed_audit:main"
fraud-stats-rigor = "src.benchmark_statistical_rigor:run"
fraud-bandit = "src.bandit.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
