name: Tests and synthetic smoke experiment
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --cov=src --cov-report=xml
        env:
          USE_GPU: "false"
      - run: python -m src.demo --output-dir results/ci_demo
        env:
          USE_GPU: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            coverage.xml
            results/ci_demo/
