services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      USE_GPU: "false"
      API_KEY: "${API_KEY:?Set API_KEY before starting}"
      MODEL_BUNDLE_PATH: /models/active
      PREDICTION_DB: /state/predictions.sqlite
      MODEL_OUTPUT_DIR: /state/models
    volumes:
      - "${MODEL_BUNDLE_DIR:?Set MODEL_BUNDLE_DIR to a real model package}:/models/active:ro"
      - service_state:/state
volumes:
  service_state:
