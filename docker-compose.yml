version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: fraud_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-fraud_dev_pass_12345}
      MYSQL_DATABASE: fraud_drift_db
    ports:
      # Bound to localhost only to prevent exposure across public network interfaces
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD:-fraud_dev_pass_12345} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fraud_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_scoring_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - API_KEY=${API_KEY:-dev-secret-key}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-fraud_dev_pass_12345}
      - DB_NAME=fraud_drift_db
      - USE_GPU=${USE_GPU:-false}
      - GPU_DEVICE=${GPU_DEVICE:-cpu}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fraud_net
    # CPU-portable by default. To enable NVIDIA GPU reservation on GPU hosts,
    # uncomment the deploy block below or set compose environment overrides:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mysql_data:
    driver: local

networks:
  fraud_net:
    driver: bridge

