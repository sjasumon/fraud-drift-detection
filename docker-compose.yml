version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: fraud_mysql_db
    restart: unless-stopped
    environment:
      # local/demo only — see config.py production guard
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: fraud_drift_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fraud_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_scoring_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=  # local/demo only — see config.py production guard
      - DB_NAME=fraud_drift_db
      - USE_GPU=true
      - GPU_DEVICE=cuda
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fraud_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysql_data:
    driver: local

networks:
  fraud_net:
    driver: bridge
